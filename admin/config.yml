backend:
  name: git-gateway
  branch: "48891"  # o master, a seconda del tuo repo

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # COLLEZIONE VP
  - name: "vp"
    label: "VP Pages"
    folder: "links"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "cartella" }
      - { label: "Permalink", name: "permalink", widget: "string" }
      - label: "Link"
        name: "links"
        widget: "list"
        fields:
          - { label: "Nome", name: "name", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
