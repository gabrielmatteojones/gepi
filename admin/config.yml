backend:
  name: git-gateway
  branch: 48891

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "articoli"
    label: "Articoli"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Titolo"
        name: "title"
        widget: "string"
      - label: "Data"
        name: "date"
        widget: "datetime"
      - label: "Tags"
        name: "tags"
        widget: "list"
        default: []
      - label: "Categorie"
        name: "categories"
        widget: "list"
        default: []
      - label: "Descrizione"
        name: "description"
        widget: "string"
      - label: "Keywords"
        name: "keywords"
        widget: "string"
      - label: "Immagine"
        name: "image"
        widget: "image"
      - label: "Ref"
        name: "ref"
        widget: "string"
      - label: "Autore"
        name: "author"
        widget: "string"
      - label: "Lingua"
        name: "lang"
        widget: "string"
      - label: "Contenuto"
        name: "body"
        widget: "markdown"

  - name: "pagine"
    label: "Pagine"
    folder: "_pages"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Titolo"
        name: "title"
        widget: "string"
      - label: "Descrizione"
        name: "description"
        widget: "string"
      - label: "Keywords"
        name: "keywords"
        widget: "string"
      - label: "Immagine"
        name: "image"
        widget: "image"
      - label: "Ref"
        name: "ref"
        widget: "string"
      - label: "Autore"
        name: "author"
        widget: "string"
      - label: "Lingua"
        name: "lang"
        widget: "string"
      - label: "Contenuto"
        name: "body"
        widget: "markdown"
