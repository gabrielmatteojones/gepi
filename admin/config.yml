backend:
  name: git-gateway
  branch: 48891

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: articoli
    label: Articoli
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: Titolo
        name: title
        widget: string
      - label: Data
        name: date
        widget: datetime
      - label: Contenuto
        name: body
        widget: markdown

  - name: pagine
    label: Pagine
    folder: _pages
    create: true
    slug: "{{slug}}"
    fields:
      - label: Titolo
        name: title
        widget: string
      - label: Contenuto
        name: body
        widget: markdown
