---
layout: default
title: Link
---

<div class="container py-5">
  <h1 class="text-center mb-4">{{ page.title }}</h1>

  <div class="row">
    {% for link in page.links %}
      <div class="col-md-4 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ link.name }}</h5>
            <a href="#"
               class="btn btn-primary"
               onclick="openIframe('{{ link.url }}'); return false;">
              Vai al link
            </a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<!-- IFRAME FULLSCREEN -->
<div id="iframeOverlay">
  <span class="close" onclick="closeIframe()">✕</span>
  <iframe id="iframeViewer"></iframe>
</div>

<style>
#iframeOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  display: none;
  z-index: 9999;
}

#iframeViewer {
  width: 100%;
  height: 100%;
  border: none;
}

#iframeOverlay .close {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 28px;
  cursor: pointer;
  z-index: 10000;
}
</style>

<script>
function openIframe(url) {
  document.getElementById('iframeViewer').src = url;
  document.getElementById('iframeOverlay').style.display = 'block';
}

function closeIframe() {
  document.getElementById('iframeViewer').src = '';
  document.getElementById('iframeOverlay').style.display = 'none';
}
</script>
