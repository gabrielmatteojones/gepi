---
layout: default
---

<div class="card-wrapper card-teaser-wrapper card-teaser-wrapper-equal card-teaser-block-3 mb-3 row">
  {% for link in page.links %}
    <div class="col-md-4 mb-4">
      <div class="align-items-center rounded shadow card-teaser card h-100">
        <div class="icon-argument-container"></div>
        <div class="card-body">
          <h3 class="card-title">
            <a data-element="custom-category-link" href="{{ link.url }}">{{ link.name }}</a>
          </h3>
          <p>
            <b>Collezione:</b> {{ page.title }}
          </p>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
