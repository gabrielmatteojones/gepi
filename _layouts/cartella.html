---
layout: base
---

<div class="container mt-5">
  <div class="row">
    {% for link in page.links %}
      <div class="col-md-3 mb-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">{{ link.name }}</h5>
            <a href="{{ link.url }}" class="btn btn-primary">Vai al link</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
