---
layout: base
---

---
layout: default
---

<div class="container mt-4">
  <div class="row justify-content-center">

    {% for link in page.links %}
    <div class="col-6 col-sm-3 col-md-2 mb-4">
      <div class="card text-center border-0">
        <a href="{{ link.url }}" class="d-block">
          <!-- Icona tramite Sprite SVG di Bootstrap Italia -->
          <svg class="icon">
            <use xlink:href="/media/sprite.svg#it-file"></use>
          </svg>
          <div class="card-body p-1">
            <p class="card-text">{{ link.name }}</p>
          </div>
        </a>
      </div>
    </div>
    {% endfor %}

  </div>
</div>
