---
layout: base
---
<main class="container my-4">
  <div class="row g-3">
    {% for card in page.cards %}
    <div class="col-6 col-sm-4 col-md-2">
      <a href="{{ card.url | default: '#' }}">
        <div class="square">
          <svg class="icon">
            <use href="/media/sprites.svg#{{ card.icon | default: 'it-folder' }}"></use>
          </svg>
          <h4>{{ card.name }}</h4>
        </div>
      </a>
    </div>
    {% endfor %}
  </div>
</main>
