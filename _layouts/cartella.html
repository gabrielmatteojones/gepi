---
layout: base
---

<div class="container mt-4">
  <div class="row justify-content-center">
    
    {% for link in page.links %}
    <div class="col-6 col-sm-3 col-md-2 mb-4">
      <div class="card text-center border-0">
        <a href="{{ link.url }}" class="d-block">
          <!-- Icona Archivio o Distretto Educativo (SVG Bootstrap Italia) -->
          {% if link.name %}
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-folder mx-auto" viewBox="0 0 16 16">
              <path d="M9.828 0H4.172A2.172 2.172 0 0 0 2 2.172v11.656A2.172 2.172 0 0 0 4.172 16h7.656A2.172 2.172 0 0 0 14 13.828V2.172A2.172 2.172 0 0 0 11.828 0H9.828a1 1 0 0 1-.707.293L7.707 1H4.293L3.707.293A1 1 0 0 1 3 0z"/>
            </svg>
          {% elsif link.name %}
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-book mx-auto" viewBox="0 0 16 16">
              <path d="M8 1.5A.5.5 0 0 0 7.5 2v12a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V2a.5.5 0 0 0-.5-.5h-7a.5.5 0 0 0-.5.5zm6 12h-6V3h6v10z"/>
            </svg>
          {% endif %}
          <div class="card-body p-1">
            <p class="card-text">{{ link.name }}</p>
          </div>
        </a>
      </div>
    </div>
    {% endfor %}
    
  </div>
</div>
