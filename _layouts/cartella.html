---
layout: base
---

<div class="it-container mt-4">
  <div class="it-row justify-content-center">

    {% for link in page.links %}
    <div class="col-6 col-md-6 mb-4"> <!-- 2 per riga, quindi 6 per ogni colonna su schermi medi e superiori -->
      <div class="it-card text-center border-0">
        <a href="{{ link.url }}" class="d-block">
          <!-- Icona tramite Sprite SVG di Bootstrap Italia -->
          <svg class="it-icon">
            <use xlink:href="/media/sprite.svg#it-file"></use>
          </svg>
          <div class="it-card-body p-1">
            <p class="it-card-text">{{ link.name }}</p>
          </div>
        </a>
      </div>
    </div>
    {% endfor %}

  </div>
</div>
