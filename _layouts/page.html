---
layout: base
---

  
<!-- iframe responsive (max 800x400, mantiene rapporto 2:1) -->
<style>
  .iframe-wrap {
    max-width: 800px;
    margin: 0 auto;
  }
  .iframe-ratio {
    position: relative;
    width: 100%;
    padding-top: 50%; /* 400/800 = 0.5 -> 50% */
  }
  .iframe-ratio iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>

<div class="iframe-wrap">
  <div class="iframe-ratio">
    <iframe
      src="{{ page.frame }}"
      loading="lazy"
      title="Iframe orizzontale responsive 800x400"
      sandbox="allow-scripts allow-same-origin"
    ></iframe>
  </div>
</div>
