# Configurazione principale del sito
environment: "production"

# Impedisce l’indicizzazione del sito dai motori di ricerca
noindex: true

# Disqus
disqus:

# Google Analytics
google_analytics:

# URL del sito
url: "https://jonez.it"
baseurl: "/"

# Permalink dei post (usa :author e :title)
collections:
  posts:
    output: true
    permalink: /posts/:categories/:title/
  docs:
    output: true
    permalink: /docs/:name/


# Versione Jekyll
version: v4.0.0

# Sass
sass:
  style: :compressed

# Plugin
plugins:
  - jekyll-sitemap
  - jekyll-feed

# Escludi questi file dalla build
exclude:
  - Gemfile
  - Gemfile.lock
  - AUTHORS
  - LICENSE
  - README.md
  - CNAME

# Informazioni generali del sito
title: "Jonez Website"
description: "Blog personale di Gabriel Jones su [argomenti]"
keywords: "blog, tecnologia, lifestyle, viaggi"
language: "it"
og_image: "/assets/logo.png"
canonical_url: "https://blog.gabrieljones.it/gabrieljones/"
rss_feed_url: "https://blog.gabrieljones.it/gabrieljones/feed"
